# Removed 'version' as it's obsolete and causes a warning

#
# -----------  NETWORK & VOLUMES  --------------------------------------------
#
networks:
  synapse-net: {}

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  neo4j_data:
  spark_master_data:

#
# -----------  CORE INFRA  ----------------------------------------------------
#
services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [synapse-net]
    ports: ["2181:2181"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "echo", "stat", "|", "nc", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [synapse-net]
    ports: ["9092:9092","29092:29092"]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL","kafka-topics --bootstrap-server kafka:29092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 2g

  kafka-topic-initializer:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-topic-initializer
    networks: [synapse-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: transactions
    command: >
      bash -c "
        echo 'Environment variables: KAFKA_BROKER=$KAFKA_BROKER, KAFKA_TOPIC=$KAFKA_TOPIC';
        if [ -z \"$KAFKA_BROKER\" ]; then
          echo 'ERROR: KAFKA_BROKER is not set';
          exit 1;
        fi;
        MAX_RETRIES=15; RETRY=0;
        echo 'Waiting for Kafka at $KAFKA_BROKER…';
        echo 'Testing connectivity to $KAFKA_BROKER…';
        nc -zv kafka 29092 && echo 'Port 29092 is open' || { echo 'ERROR: Cannot connect to kafka:29092'; exit 1; };
        until kafka-topics --bootstrap-server $KAFKA_BROKER --list >/dev/null 2>&1; do
          echo 'Kafka not ready, retrying in 5 seconds (Attempt $((RETRY+1))/$MAX_RETRIES)…';
          sleep 5;
          ((RETRY++));
          if [ $RETRY -ge $MAX_RETRIES ]; then
            echo 'ERROR: Kafka not available after $MAX_RETRIES attempts';
            kafka-topics --bootstrap-server $KAFKA_BROKER --list 2>&1;
            exit 1;
          fi;
        done;
        echo 'Kafka is ready, creating topic $KAFKA_TOPIC…';
        kafka-topics --bootstrap-server $KAFKA_BROKER --create --if-not-exists --topic $KAFKA_TOPIC --partitions 1 --replication-factor 1 || { echo 'ERROR: Failed to create topic'; exit 1; };
        if kafka-topics --bootstrap-server $KAFKA_BROKER --list | grep -q $KAFKA_TOPIC; then
          echo '✔️  Topic $KAFKA_TOPIC created successfully';
        else
          echo 'ERROR: Topic creation failed';
          kafka-topics --bootstrap-server $KAFKA_BROKER --list 2>&1;
          exit 1;
        fi"
    restart: on-failure

  neo4j:
    image: neo4j:5.19.0-community
    container_name: neo4j
    networks: [synapse-net]
    ports: ["7474:7474","7687:7687"]
    volumes:
      - neo4j_data:/data
      - ./neo4j_scripts:/scripts
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 3G
    healthcheck:
      test: ["CMD-SHELL","wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    mem_limit: 4g

  neo4j-initializer:
    build: ./neo4j_scripts
    container_name: neo4j-initializer
    networks: [synapse-net]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j_scripts/cypher_scripts:/cypher_scripts
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
    command: /app/init_neo4j.sh
    restart: on-failure

#
# -----------  SPARK CLUSTER  -------------------------------------------------
#
  spark-master:
    build: ./spark_app
    container_name: spark-master
    networks: [synapse-net]
    ports: ["8080:8080","7077:7077"]
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: 0.0.0.0
      SPARK_DRIVER_MEMORY: 4g
      SPARK_WORKER_MEMORY: 4g
      HADOOP_USER_NAME: spark
      USER: spark
    volumes:
      - spark_master_data:/opt/bitnami/spark/data
      - ./spark_app:/app
    healthcheck:
      test: ["CMD-SHELL","nc -z localhost 7077"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s
    mem_limit: 8g

  spark-worker:
    build: ./spark_app
    container_name: spark-worker
    networks: [synapse-net]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: 4
      HADOOP_USER_NAME: spark
      USER: spark
    volumes:
      - ./spark_app:/app
    mem_limit: 8g

#
# -----------  SPARK STREAMING APPLICATION  -----------------------------------
#
  spark-app:
    build: ./spark_app
    container_name: spark-app
    networks: [synapse-net]
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      flask-llm-service:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: transactions
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      LLM_SERVICE_URL: http://flask-llm-service:5000/generate-sar
      HADOOP_USER_NAME: spark
      USER: spark
    entrypoint: [""] # Keep this for spark-submit to take full control
    volumes:
      - ./spark_app:/app
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --master; spark://spark-master:7077
      - --deploy-mode; client
      - --conf; spark.driver.memory=4g
      - --conf; spark.executor.memory=4g
      - --conf; spark.driver.extraJavaOptions=-Duser.name=spark
      - --conf; spark.executor.extraJavaOptions=-Duser.name=spark
      - --conf; spark.jars.ivy=/tmp/.ivy2
      - --packages; org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      - --jars; /app/neo4j-connector-apache-spark_2.12-5.3.8_for_spark_3.jar
      - /app/streaming_app.py
    restart: on-failure
    mem_limit: 8g

#
# -----------  DATA GENERATOR  ------------------------------------------------
#
  data-generator:
    build: ./data
    container_name: data-generator
    networks: [synapse-net]
    depends_on:
      kafka-topic-initializer:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: transactions
    command: >
      bash -c "python3 bitcoin_mempool_consumer.py | python3 producer_app.py"
    restart: on-failure
    mem_limit: 1.5g

#
# -----------  AI MICRO-SERVICE & UI  ----------------------------------------
#
  flask-llm-service:
    build: ./ai_service
    container_name: flask-llm-service
    networks: [synapse-net]
    ports: ["8000:5000"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      GEMINI_API_KEY: ""
    command: ["gunicorn","-b","0.0.0.0:5000","app:app","--workers","2"]
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:5000/health"]
      interval: 10s
      retries: 5
    mem_limit: 2g

  streamlit-dashboard:
    build: ./streamlit_app
    container_name: streamlit-dashboard
    networks: [synapse-net]
    ports: ["8501:8501"]
    depends_on:
      neo4j:
        condition: service_healthy
      flask-llm-service:
        condition: service_started
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      LLM_SERVICE_URL: http://flask-llm-service:5000/generate-sar
    mem_limit: 2.5g