# docker-compose.yml
# This file orchestrates all the services for your Synapse-Lite project.
# Each service runs in its own Docker container, allowing for isolated
# environments and simplified dependency management.

version: '3.8' # Specify the Docker Compose file format version

services:
  # Zookeeper: Essential for Kafka to function.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  # Kafka: The real-time message broker for transactions.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Neo4j: Graph database for relationship analysis (future integration).
  neo4j:
    image: neo4j:5.19.0-community
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
    volumes:
      - neo4j_data:/data
      - ./neo4j_scripts:/var/lib/neo4j/import

  # Cassandra: NoSQL database for storing alerts.
  cassandra:
    image: cassandra:4.1.3
    container_name: cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./cassandra_init:/cassandra_init
    # ********* CRITICAL FIX: Use entrypoint for init, command for main process *********
    entrypoint: ["/bin/bash", "-c", "chmod +x /cassandra_init/init.sh && /cassandra_init/init.sh"]
    command: ["cassandra", "-f"] # This is the main Cassandra daemon command
    healthcheck: # Health check as previously defined
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  # Spark Master: The coordinator for the Spark cluster.
  spark-master:
    build:
      context: ./spark_app
      dockerfile: Dockerfile
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "false"
      SPARK_RPC_ENCRYPTION_ENABLED: "false"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "false"
      SPARK_DRIVER_MEMORY: 2g
      SPARK_WORKER_MEMORY: 2g
      SPARK_MASTER_HOST: 0.0.0.0
    volumes:
      - spark_master_data:/opt/bitnami/spark/data
      - ./spark_app:/app
    healthcheck:
      disable: true
    command: /opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # Spark Worker: The executor nodes for Spark jobs.
  spark-worker:
    build:
      context: ./spark_app
      dockerfile: Dockerfile
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_started
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_RPC_AUTHENTICATION_ENABLED: "false"
      SPARK_RPC_ENCRYPTION_ENABLED: "false"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "false"
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 1
    volumes:
      - ./spark_app:/app
    command: /opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # Spark Application: Runs your PySpark streaming job to process transactions.
  spark-app:
    build:
      context: ./spark_app
      dockerfile: Dockerfile
    container_name: spark-app
    depends_on:
      kafka:
        condition: service_started
      spark-master:
        condition: service_started
      cassandra:
        condition: service_healthy # Still wait for Cassandra healthcheck
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: transactions
      CASSANDRA_HOST: cassandra
      CASSANDRA_KEYSPACE: synapse_lite_ks
      CASSANDRA_TABLE: alerts
    volumes:
      - ./spark_app:/app

  # Data Generator: Python service to generate synthetic transactions and push to Kafka.
  data-generator:
    build:
      context: ./data
      dockerfile: Dockerfile
    container_name: data-generator
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: transactions
    command: bash -c "python bitcoin_mempool_consumer.py | kafka-console-producer --broker-list kafka:29092 --topic transactions"

  # Flask LLM Service: Microservice for AI-generated SAR drafts.
  flask-llm-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: flask-llm-service
    ports:
      - "8000:5000"
    depends_on:
      - neo4j
      - cassandra
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      CASSANDRA_CONTACT_POINTS: cassandra

  # Streamlit Dashboard: Frontend UI for displaying alerts and interacting with services.
  streamlit-dashboard:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: streamlit-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - cassandra
      - neo4j
      - flask-llm-service
    environment:
      CASSANDRA_CONTACT_POINTS: cassandra
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      LLM_SERVICE_URL: http://flask-llm-service:5000

# Define named volumes for persistent data storage across container restarts
volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  neo4j_data:
  cassandra_data:
  spark_master_data: