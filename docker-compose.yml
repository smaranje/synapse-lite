# docker-compose.yml  — fully rewritten with the last missing fix
# --------------------------------------------------------------
# • Adds --py-files so every Spark executor receives model.py & fraud_rules.py
# • Nothing else changed (your earlier fixes remain intact)

networks:
  synapse-net: {}

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  neo4j_data:
  spark_master_data:

services:
  # -------------- ZOOKEEPER & KAFKA ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [synapse-net]
    ports: ["2181:2181"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "echo", "stat", "|", "nc", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [synapse-net]
    ports: ["9092:9092", "29092:29092"]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  kafka-topic-initializer:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-topic-initializer
    networks: [synapse-net]
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        echo 'Waiting for Kafka…' && \
        kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1 && \
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic transactions --partitions 1 --replication-factor 1 && \
        echo '✔️  topic ready'
    restart: "no"

  # ------------------ NEO4J ------------------------
  neo4j:
    image: neo4j:5.19.0-community
    container_name: neo4j
    networks: [synapse-net]
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  neo4j-initializer:
    build: ./neo4j_scripts
    container_name: neo4j-initializer
    networks: [synapse-net]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j_scripts/cypher_scripts:/cypher_scripts
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
    command: /app/init_neo4j.sh
    restart: on-failure

  # ------------------ SPARK CLUSTER ---------------
  spark-master:
    build: ./spark_app
    container_name: spark-master
    networks: [synapse-net]
    ports: ["8080:8080", "7077:7077"]
    entrypoint: [""]
    command:
      - /opt/bitnami/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - 0.0.0.0
    environment:
      HADOOP_USER_NAME: spark
      USER: spark
    volumes:
      - spark_master_data:/opt/bitnami/spark/data
      - ./spark_app:/app
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7077"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s

  spark-worker:
    build: ./spark_app
    container_name: spark-worker
    networks: [synapse-net]
    depends_on:
      spark-master:
        condition: service_healthy
    entrypoint: [""]
    command:
      - /opt/bitnami/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      HADOOP_USER_NAME: spark
      USER: spark
    volumes:
      - ./spark_app:/app

  spark-app:
    build: ./spark_app
    container_name: spark-app
    networks: [synapse-net]
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    entrypoint: [""]
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      - --jars
      - /opt/bitnami/spark/jars/neo4j-connector-apache-spark_2.12-5.3.8_for_spark_3.jar
      - --py-files
      - /app/model.py,/app/fraud_rules.py           # ←―― the critical addition
      - /app/streaming_app.py
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: transactions
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      HADOOP_USER_NAME: spark
      USER: spark
    restart: on-failure

  # ---------------- DATA GENERATOR ----------------
  data-generator:
    build: ./data
    container_name: data-generator
    networks: [synapse-net]
    depends_on:
      kafka-topic-initializer:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: transactions
    command: >
      bash -c "python3 bitcoin_mempool_consumer.py | python3 producer_app.py"
    restart: on-failure

  # ---------- AI SERVICE & DASHBOARD --------------
  flask-llm-service:
    build: ./ai_service
    container_name: flask-llm-service
    networks: [synapse-net]
    ports: ["8000:5000"]
    depends_on:
      neo4j:
        condition: service_healthy
    command: ["gunicorn", "-b", "0.0.0.0:5000", "app:app", "--workers", "2"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password

  streamlit-dashboard:
    build: ./streamlit_app
    container_name: streamlit-dashboard
    networks: [synapse-net]
    ports: ["8501:8501"]
    depends_on:
      neo4j:
        condition: service_healthy
      flask-llm-service:
        condition: service_started
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
