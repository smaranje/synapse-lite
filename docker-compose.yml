# docker-compose.yml
version: '3.8'

networks:
  synapse-net:
    driver: bridge

volumes:
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local
  spark_master_data:
    driver: local
  neo4j_data:
    driver: local

services:
  zookeeper:
    image: bitnami/zookeeper:3.9.2
    container_name: zookeeper
    networks: [synapse-net]
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper_data:/bitnami/zookeeper
      - zookeeper_log:/opt/bitnami/zookeeper/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "echo stat | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7.0
    container_name: kafka
    networks: [synapse-net]
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-topic-initializer:
    image: bitnami/kafka:3.7.0
    container_name: kafka-topic-initializer
    networks: [synapse-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=transactions
    volumes:
      - ./init_kafka_topic.sh:/init_kafka_topic.sh
    command: ["bash", "/init_kafka_topic.sh"]

  spark-master:
    image: bitnami/spark:3.5.6-debian-12-r0
    container_name: spark-master
    networks: [synapse-net]
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_AUTH_SECRET=testing
      - SPARK_LOCAL_STORAGE_DB=false
      - SPARK_SSL_ENABLED=no
    volumes:
      - spark_master_data:/bitnami/spark/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker:
    image: bitnami/spark:3.5.6-debian-12-r0
    container_name: spark-worker
    networks: [synapse-net]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4G
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_AUTH_SECRET=testing
      - SPARK_LOCAL_STORAGE_DB=false
      - SPARK_SSL_ENABLED=no

  spark-app:
    build:
      context: ./spark_app
      dockerfile: Dockerfile
    container_name: spark-app
    networks: [synapse-net]
    depends_on:
      spark-master:
        condition: service_started
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      - SPARK_MODE=client
      - SPARK_MASTER_URL=spark://spark-master:7077
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=transactions
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - LLM_SERVICE_URL=http://flask-llm-service:5000/generate-sar
    volumes:
      - ./spark_app/streaming_app.py:/app/streaming_app.py
      - ./spark_app/model.py:/app/model.py
      - ./spark_app/fraud_rules.py:/app/fraud_rules.py
      - ./spark_app/bitcoin_fraud_model.pkl:/app/bitcoin_fraud_model.pkl
      - ./spark_app/neo4j-connector-apache-spark_2.12-5.3.8_for_spark_3.jar:/app/neo4j-connector-apache-spark_2.12-5.3.8_for_spark_3.jar
    command: >
      spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6
      --jars /app/neo4j-connector-apache-spark_2.12-5.3.8_for_spark_3.jar
      /app/streaming_app.py

  data-generator:
    build:
      context: ./data # <--- CORRECTED: Changed from ./data_generator to ./data
      dockerfile: Dockerfile
    container_name: data-generator
    networks: [synapse-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=transactions
    command: python /app/producer_app.py

  neo4j:
    image: neo4j:4.4.29-community
    container_name: neo4j
    networks: [synapse-net]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_connector_bolt_advertised__address=localhost:7687
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j-initializer:
    build:
      context: ./neo4j_initializer
      dockerfile: Dockerfile
    container_name: neo4j-initializer
    networks: [synapse-net]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
    command: python /app/init_db.py

  flask-llm-service:
    build:
      context: ./ai_service # <--- CORRECTED: Changed from ./flask_llm_service to ./ai_service
      dockerfile: Dockerfile
    container_name: flask-llm-service
    networks: [synapse-net]
    ports:
      - "5000:5000"
    environment:
      # No API key needed for local gemini-2.0-flash
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  streamlit-dashboard:
    build:
      context: ./streamlit_dashboard
      dockerfile: Dockerfile
    container_name: streamlit-dashboard
    networks: [synapse-net]
    ports:
      - "8501:8501"
    depends_on:
      neo4j:
        condition: service_healthy
      flask-llm-service:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
    command: streamlit run /app/dashboard.py