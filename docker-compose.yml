# docker-compose.yml
# This file orchestrates all the services for your Synapse-Lite project.
# Each service runs in its own Docker container, allowing for isolated
# environments and simplified dependency management.

version: '3.8' # Specify the Docker Compose file format version

services:
  # Zookeeper: Essential for Kafka to function.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0 # Using a stable Confluent Zookeeper image
    container_name: zookeeper
    ports:
      - "2181:2181" # Map internal Zookeeper port to host machine
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data # Persistent data volume for Zookeeper
      - zookeeper_log:/var/lib/zookeeper/log   # Persistent log volume

  # Kafka: The real-time message broker for transactions.
  kafka:
    image: confluentinc/cp-kafka:7.5.0 # Using a stable Confluent Kafka image
    container_name: kafka
    ports:
      - "9092:9092" # For external connections from your host machine (e.g., if you use a Kafka client outside Docker)
      - "29092:29092" # For internal communication between Docker containers (e.g., Spark, Data Generator)
    depends_on:
      - zookeeper # Kafka must start after Zookeeper
    environment:
      KAFKA_BROKER_ID: 1 # Unique ID for this Kafka broker
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 # How Kafka finds Zookeeper (using service name)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # For demo, set to 1 for simplicity
    volumes:
      - kafka_data:/var/lib/kafka/data # Persistent data volume for Kafka logs/data

  # Neo4j: Graph database for relationship analysis (future integration).
  neo4j:
    image: neo4j:5.19.0-community # Using a recent community version of Neo4j
    container_name: neo4j
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol (for drivers to connect)
    environment:
      NEO4J_AUTH: neo4j/password # IMPORTANT: Change this password for production!
      NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes' # Auto-accept license for non-interactive setup
      # NEO4J_dbms_memory_heap_max__size: 512M # Uncomment and adjust based on your RAM for larger datasets
      # NEO4J_dbms_memory_heap_initial__size: 256M
    volumes:
      - neo4j_data:/data # Persistent data volume for Neo4j database
      - ./neo4j_scripts:/var/lib/neo4j/import # Optional: Mount directory for initial Cypher scripts

  # Cassandra: NoSQL database for storing alerts (future integration).
  cassandra:
    image: cassandra:4.1.3 # Using a stable Cassandra image
    container_name: cassandra
    ports:
      - "9042:9042" # CQL native protocol port
    volumes:
      - cassandra_data:/var/lib/cassandra # Persistent data volume for Cassandra

  # Spark Master: The coordinator for the Spark cluster.
  spark-master:
    build:
      context: ./spark_app
      dockerfile: Dockerfile
    container_name: spark-master
    ports:
      - "8080:8080" # Spark Web UI
      - "7077:7077" # Spark Master's internal communication port
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "false"
      SPARK_RPC_ENCRYPTION_ENABLED: "false"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "false"
      SPARK_DRIVER_MEMORY: 2g
      SPARK_WORKER_MEMORY: 2g
      SPARK_DAEMON_JAVA_OPTS: "-Xms1024m -Xmx2048m"
      SPARK_MASTER_HOST: 0.0.0.0 # Explicitly listen on all interfaces
    volumes:
      - spark_master_data:/opt/bitnami/spark/data
      - ./spark_app:/app
    healthcheck: # Health check for Spark Master readiness
      test: ["CMD-SHELL", "nc -z localhost 7077 || exit 1"] # Check if RPC port is open
      interval: 5s # Check every 5 seconds
      timeout: 5s # Wait up to 5 seconds for a response
      retries: 10 # Retry 10 times before marking unhealthy (50 seconds total)
      start_period: 30s # Wait 30 seconds before starting health checks (give time to boot)

  # Spark Worker: The executor nodes for Spark jobs.
  spark-worker:
    build:
      context: ./spark_app
      dockerfile: Dockerfile
    container_name: spark-worker
    depends_on:
      spark-master: # Wait for Spark Master to be healthy before starting worker
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_RPC_AUTHENTICATION_ENABLED: "false"
      SPARK_RPC_ENCRYPTION_ENABLED: "false"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "false"
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 1
      SPARK_DAEMON_JAVA_OPTS: "-Xms1024m -Xmx2048m"
    volumes:
      - ./spark_app:/app

  # Spark Application: Runs your PySpark streaming job to process transactions.
  spark-app:
    build:
      context: ./spark_app
      dockerfile: Dockerfile
    container_name: spark-app
    depends_on:
      kafka:
        condition: service_started # Kafka only needs to be started
      spark-master:
        condition: service_healthy # IMPORTANT: Wait for Spark Master to be HEALTHY
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: transactions
    volumes:
      - ./spark_app:/app
    # CMD is in Dockerfile (shell form: CMD bash -c "...")

  # Data Generator: Python service to generate synthetic transactions and push to Kafka.
  data-generator:
    build:
      context: ./data
      dockerfile: Dockerfile
    container_name: data-generator
    depends_on:
      - kafka # Must start after Kafka is ready
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: transactions
    command: bash -c "python bitcoin_mempool_consumer.py | kafka-console-producer --broker-list kafka:29092 --topic transactions"

  # Flask LLM Service: Microservice for AI-generated SAR drafts.
  flask-llm-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: flask-llm-service
    ports:
      - "8000:5000"
    depends_on:
      - neo4j
      - cassandra
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      CASSANDRA_CONTACT_POINTS: cassandra

  # Streamlit Dashboard: Frontend UI for displaying alerts and interacting with services.
  streamlit-dashboard:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: streamlit-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - cassandra
      - neo4j
      - flask-llm-service
    environment:
      CASSANDRA_CONTACT_POINTS: cassandra
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      LLM_SERVICE_URL: http://flask-llm-service:5000

# Define named volumes for persistent data storage across container restarts
volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  neo4j_data:
  cassandra_data:
  spark_master_data:
