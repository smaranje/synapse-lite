# docker-compose-robust.yml - Robust Configuration Addressing Cascade of Misconfigurations

####################
# Networks & Volumes
####################
networks:
  synapse-net:
    driver: bridge

volumes:
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local
  spark_master_data:
    driver: local
  neo4j_data:
    driver: local
  redis_data:
    driver: local

####################
# Service Definitions
####################
services:

  ############################################################
  # Redis Cache Service - First to start (no dependencies)
  ############################################################
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - synapse-net
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ############################################################
  # Zookeeper - Foundation for Kafka
  ############################################################
  zookeeper:
    image: bitnami/zookeeper:3.9.2
    container_name: zookeeper
    networks:
      - synapse-net
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_HEAP_SIZE=512
    volumes:
      - zookeeper_data:/bitnami/zookeeper
      - zookeeper_log:/opt/bitnami/zookeeper/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'srvr' | nc -w 2 localhost 2181 | grep -q 'Mode:'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    restart: unless-stopped

  ############################################################
  # Kafka - Properly configured with robust health check
  ############################################################
  kafka:
    image: bitnami/kafka:3.7.0
    container_name: kafka
    networks:
      - synapse-net
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_NUM_PARTITIONS=4
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_CFG_COMPRESSION_TYPE=lz4
      - KAFKA_CFG_LOG_RETENTION_HOURS=24
      - KAFKA_CFG_LOG_SEGMENT_BYTES=1073741824
      - KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS=300000
      - KAFKA_HEAP_OPTS=-Xmx1G -Xms512M
    volumes:
      - kafka_data:/bitnami/kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  ############################################################
  # Kafka Topic Initializer - Creates topics after Kafka is healthy
  ############################################################
  kafka-topic-initializer:
    image: bitnami/kafka:3.7.0
    container_name: kafka-topic-initializer
    networks:
      - synapse-net
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=transactions
      - KAFKA_PARTITIONS=4
      - KAFKA_REPLICATION_FACTOR=1
    volumes:
      - ./init_kafka_topic.sh:/init_kafka_topic.sh:ro
    command:
      - bash
      - -c
      - "/init_kafka_topic.sh"
    restart: "no"

  ############################################################
  # Spark Master - Core processing engine
  ############################################################

  spark-master:
    image: bitnami/spark:3.5.6-debian-12-r0
    container_name: spark-master
    networks: [synapse-net]
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_AUTH_SECRET=testing
      - SPARK_LOCAL_STORAGE_DB=false
      - SPARK_SSL_ENABLED=no

      # <-- Remove this:
      # - SPARK_MASTER_OPTS=-Xmx1g

      # <-- Add these instead:
      - SPARK_DAEMON_MEMORY=2g
      - SPARK_DRIVER_MEMORY=2g
      - SPARK_EXECUTOR_MEMORY=3g
    volumes:
      - spark_master_data:/bitnami/spark/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  ############################################################
  # Spark Worker - Processing node
  ############################################################
  spark-worker:
    image: bitnami/spark:3.5.6-debian-12-r0
    container_name: spark-worker
    networks:
      - synapse-net
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_AUTH_SECRET=testing
      - SPARK_SSL_ENABLED=no

      spark-app:
    image: synapse-lite-spark-app
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    networks:
      - synapse-net
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      # any other env your job needs…
    command: >
      spark-submit
      --master ${SPARK_MASTER_URL}
      --deploy-mode cluster
      /app/streaming_app_optimized.py

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ############################################################
  # Neo4j Database - Properly configured with sufficient memory
  ############################################################
  neo4j:
    image: neo4j:5.19-community
    container_name: neo4j
    networks:
      - synapse-net
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  ############################################################
  # Neo4j Initializer - Sets up database schema
  ############################################################
  neo4j-initializer:
    image: neo4j:5.19-community
    container_name: neo4j-initializer
    networks:
      - synapse-net
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./neo4j_scripts/init_neo4j.sh:/app/init_neo4j.sh:ro
    command:
      - bash
      - -c
      - "/app/init_neo4j.sh"
    restart: "no"

  ############################################################
  # Flask LLM Service - AI processing backend
  ############################################################
  flask-llm-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: flask-llm-service
    networks:
      - synapse-net
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ############################################################
  # Data Generator - Synthetic or real transaction producer
  ############################################################
  data-generator:
    build:
      context: ./data
      dockerfile: Dockerfile
    container_name: data-generator
    networks:
      - synapse-net
    depends_on:
      kafka-topic-initializer:
        condition: service_completed_successfully
    volumes:
      - ./data:/app
    working_dir: /app
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=transactions
      - PRODUCER_RATE=1
    command: >
      python producer_app_robust.py
    restart: unless-stopped

  ############################################################
  # Spark Application - Core streaming job
  ############################################################

  spark-app:
    build:
      context: ./spark_app
      dockerfile: Dockerfile.optimized
    container_name: spark-app
    networks:
      - synapse-net
-   depends_on:
-     spark-worker:
-       condition: service_healthy
+   depends_on:
+     spark-master:
+       condition: service_healthy
+     spark-worker:
+       condition: service_healthy
     neo4j-initializer:
       condition: service_completed_successfully
     flask-llm-service:
       condition: service_healthy
     data-generator:
       condition: service_started
    volumes:
      - ./spark_app:/app
    command: >
      spark-submit
        --master spark://spark-master:7077
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6
        --jars /app/neo4j-connector-apache-spark_2.12-5.3.8_for_spark_3.jar
        --conf spark.sql.streaming.checkpointLocation=/tmp/checkpoints
        /app/streaming_app_robust.py
    restart: unless-stopped

  ############################################################
  # Streamlit Dashboard - User Interface
  ############################################################
  streamlit-dashboard:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: streamlit-dashboard
    networks:
      - synapse-net
    ports:
      - "8501:8501"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./streamlit_app:/home/streamlit_app
    working_dir: /home/streamlit_app
    command: >
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501
    restart: unless-stopped
